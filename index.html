<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catharine Fedeli, M.D., Ph.D.</title>
  <meta name="description" content="Dr. Catharine Buttinger Fedeli has retired and is no longer accepting new patients. Contact information for former patients.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3a5f'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='28' fill='white' text-anchor='middle'%3ECF%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1e2430;
      --muted: #5a6473;
      --accent: #1f3a5f;
      --rule: #d9d4ca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141922;
        --card: #1c2330;
        --text: #e8ebf0;
        --muted: #a2acba;
        --accent: #9db8d9;
        --rule: #2d3747;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 48px 40px;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.9rem;
      font-weight: normal;
      letter-spacing: 0.01em;
      color: var(--accent);
    }
    .credentials {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      width: 64px;
      margin: 0 auto 28px;
    }
    p { margin: 0 0 18px; font-size: 1.1rem; }
    p:last-child { margin-bottom: 0; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .note { color: var(--muted); font-size: 0.95rem; }
    @media (max-width: 480px) {
      main { padding: 36px 22px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Catharine Fedeli</h1>
    <p class="credentials">M.D., Ph.D.</p>
    <hr>
    <p>Dr. Buttinger Fedeli has retired and is no longer accepting new patients.</p>
    <p>If you need to contact Dr. Buttinger Fedeli, please send an email to
      <a href="mailto:catharine@fedelimd.com?subject=Message%20via%20fedelimd.com">catharine@fedelimd.com</a>.</p>
    <p class="note">Please email rather than text.</p>
  </main>
</body>
</html>
